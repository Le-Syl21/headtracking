# Configuration for `cross` (https://github.com/cross-rs/cross).
#
# `cross` runs the cargo build inside a Linux container with the right
# cross-compiler for the target. The default images don't include the
# system packages our vendored cmake projects need (libfreenect /
# libfreenect2 want libusb-1.0-dev + Python; SDL3 wants its own deps for
# the demo binary). Add them via `pre-build` so the container has them
# before cargo invokes the build scripts.

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install -y --no-install-recommends python3 cmake pkg-config",
    # cmake's `find_package(Python REQUIRED)` looks for `python` first.
    # Older cross-rs base images (Ubuntu 16.04 / 18.04) ship `python3`
    # but no `python-is-python3` package, so symlink manually.
    "ln -sf /usr/bin/python3 /usr/local/bin/python",
    # The base image's libclang is too old for bindgen >=0.70 (calls
    # `clang_getTranslationUnitTargetInfo` which only landed in
    # clang-14+). Install a newer toolchain.
    "apt-get install -y --no-install-recommends clang libclang-dev",
    "apt-get install -y --no-install-recommends libusb-1.0-0-dev:arm64 libudev-dev:arm64",
    # SDL3 build-deps for the demo. Shortened to packages that exist on
    # the older cross-rs base image (libdecor-0-dev / libxtst-dev etc.
    # were unavailable, killing the whole apt run). The demo still
    # builds, the audio backends auto-disable when their .pc files
    # aren't found — this is acceptable on aarch64 (experimental).
    "apt-get install -y --no-install-recommends libasound2-dev:arm64 libpulse-dev:arm64 libx11-dev:arm64 libxext-dev:arm64 libxrandr-dev:arm64 libxcursor-dev:arm64 libxi-dev:arm64 libxss-dev:arm64 libxkbcommon-dev:arm64 libgl1-mesa-dev:arm64 libegl1-mesa-dev:arm64 libdrm-dev:arm64 libwayland-dev:arm64 libdbus-1-dev:arm64",
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "CMAKE_POLICY_VERSION_MINIMUM",
    "VPX_PLUGINS_DIR",
]
