# Configuration for `cross` (https://github.com/cross-rs/cross).
#
# `cross` runs the cargo build inside a Linux container with the right
# cross-compiler for the target. The default images don't include the
# system packages our vendored cmake projects need (libfreenect /
# libfreenect2 want libusb-1.0-dev + Python; SDL3 wants its own deps for
# the demo binary). Add them via `pre-build` so the container has them
# before cargo invokes the build scripts.

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install -y --no-install-recommends python3 cmake pkg-config",
    "apt-get install -y --no-install-recommends libusb-1.0-0-dev:arm64 libudev-dev:arm64",
    # SDL3 build deps (demo binary). Many of these are large; the demo
    # itself isn't the priority on aarch64 — feel free to keep
    # experimental: true on that matrix entry until users actually ask.
    "apt-get install -y --no-install-recommends \
        libasound2-dev:arm64 libpulse-dev:arm64 \
        libx11-dev:arm64 libxext-dev:arm64 libxrandr-dev:arm64 \
        libxcursor-dev:arm64 libxfixes-dev:arm64 libxi-dev:arm64 \
        libxinerama-dev:arm64 libxss-dev:arm64 libxtst-dev:arm64 \
        libxkbcommon-dev:arm64 libgl1-mesa-dev:arm64 \
        libegl1-mesa-dev:arm64 libgles2-mesa-dev:arm64 \
        libdrm-dev:arm64 libgbm-dev:arm64 libwayland-dev:arm64 \
        libdecor-0-dev:arm64 libdbus-1-dev:arm64",
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "CMAKE_POLICY_VERSION_MINIMUM",
    "VPX_PLUGINS_DIR",
]
