name: CI

# Aucun build sur push `main` : le travail arrive en direct sur main, donc un
# build par commit ne ferait que du bruit. Les gates tournent sur PR, sur tag
# (avant toute signature/publication) et à la demande.
on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # libfreenect2's vendored CMakeLists declares a min cmake older than
  # 3.5; CMake 4.x dropped that compat. Set the policy fallback version
  # so cmake-rs invocations don't trip on it.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # Pin the macOS deployment target so cc-rs / cmake / clang and rustc
  # agree on the same ABI level (otherwise the link errors on
  # __isPlatformVersionAtLeast). 11.0 = Big Sur. Linux/Windows ignore.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Actions tierces épinglées au SHA du commit, pas au tag (même raison que
      # dans `release.yml` : un tag est mutable, un SHA non).
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-test:
    name: clippy + tests (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: Install build deps
        run: |
          sudo apt-get update
          # Full SDL3 build-deps list (per
          # https://wiki.libsdl.org/SDL3/README-linux) plus libusb / libudev
          # for libfreenect[2]. Even though our plugin doesn't actually use
          # SDL3 (dlsym at runtime), the workspace's `headtracking-demo`
          # binary does — and `cargo clippy --workspace` builds every member.
          sudo apt-get install -y --no-install-recommends \
            cmake clang libclang-dev pkg-config ninja-build \
            libusb-1.0-0-dev libudev-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            libsndio-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxss-dev \
            libxtst-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdbus-1-dev libibus-1.0-dev

      - name: Clippy (all features)
        run: cargo clippy --workspace --release --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --release --all-features
