name: Release

# The only workflow in this repository. A push builds nothing: work lands on
# `main` continuously and a build per commit would burn four runners to tell
# us what `cargo test` already said locally.
#
# One chain, in this order, and each link gates the next:
#
#   check   cargo fmt --check, clippy -D warnings, the test suite. Fails
#           here and nothing is built.
#   build   the matrix — cdylib (`headtracking`) + demo, bundled with
#           `plugin.cfg` and `LICENSE`, uploaded as a workflow artifact.
#   sign    Windows/macOS, behind the `signing` environment. Tag only.
#   release published from the artifacts already built. Nothing is
#           recompiled to publish it. Tag only.
#
# `workflow_dispatch` runs check + build and stops there: the dry run that
# says whether a tag would succeed, and the way to hand a tester an
# (unsigned) build without cutting a release.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  # Manual dry-run: checks and builds the whole matrix without publishing.
  # Use this to validate every target before pushing the actual tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # libfreenect2's submodule (v0.2.1) declares CMAKE_MINIMUM_REQUIRED < 3.5,
  # which CMake 4.x removed compatibility for. This env var tells CMake to
  # accept it. Applied at workflow level so every cmake-rs invocation in
  # the build picks it up.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # Pin the macOS deployment target so cc-rs / cmake / clang agree on a
  # single ABI level. Without this, cc-rs picks the runner's SDK version
  # (e.g. 15.5) for compiled .o files while rustc targets 11.0, and the
  # final link errors on `___isPlatformVersionAtLeast` (a clang
  # version-check helper that isn't needed when source SDK == target SDK).
  # 11.0 (Big Sur, late 2020) is broad enough for any pincab user.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  # Everything that can fail without a compiler for four platforms. It runs
  # first and `build` waits on it, so a tag that does not pass its own tests
  # never reaches a runner, let alone a release page.
  #
  # Moved here from a `ci.yml` that only triggered on `pull_request` — and
  # this repository does not use pull requests, so in practice it never ran
  # on its own. A gate nothing triggers is not a gate.
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Third-party actions are pinned to a commit SHA, not a tag: a tag is
      # mutable, a SHA is not.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Same ort-download-cache pairing as the build job: the target dir's
      # ort-sys fingerprint replays a link-search into this dir, so both must
      # live and die together in the cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-directories: ~/.cache/ort.pyke.io

      # Formatting first: it needs no dependencies, so a badly formatted tree
      # fails in seconds instead of after a full dependency build.
      - name: Formatting
        run: cargo fmt --all --check

      - name: Install build deps
        run: |
          sudo apt-get update
          # Full SDL3 build-deps list (per
          # https://wiki.libsdl.org/SDL3/README-linux) plus libusb / libudev
          # for libfreenect[2]. Even though our plugin doesn't actually use
          # SDL3 (dlsym at runtime), the workspace's `headtracking-demo`
          # binary does — and `cargo clippy --workspace` builds every member.
          sudo apt-get install -y --no-install-recommends \
            cmake clang libclang-dev pkg-config ninja-build \
            opencl-headers ocl-icd-opencl-dev \
            libusb-1.0-0-dev libudev-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            libsndio-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxss-dev \
            libxtst-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdbus-1-dev libibus-1.0-dev

      - name: Clippy (all features)
        run: cargo clippy --workspace --release --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --release --all-features

  # The ONNX models are platform-agnostic: fetch them ONCE here and fan
  # them out to the whole matrix as a workflow artifact, instead of four
  # parallel fresh checkouts each hitting Hugging Face (2 files × 4
  # targets = 8 downloads — which is exactly how the v0.0.27-preview
  # Windows leg got HTTP 429'd). blazepose's build.rs skips the download
  # when the files are already present, and keeps its own retry/backoff
  # as the fallback for local builds.
  fetch-models:
    name: Fetch ONNX models (shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The models almost never change (the URLs pin an exact HF
      # revision), so a cache keyed on build.rs — where the URLs live —
      # makes reruns hit Hugging Face zero times. Changing a model URL
      # changes the key, so the cache can never serve stale models.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: models-cache
        with:
          path: crates/blazepose/models
          key: onnx-models-${{ hashFiles('crates/blazepose/build.rs') }}

      # Single source of truth for names/URLs: blazepose's build.rs.
      - name: Download models with retry/backoff
        if: steps.models-cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'EOF'
          import pathlib, re, time, urllib.request

          src = pathlib.Path("crates/blazepose/build.rs").read_text()
          pairs = re.findall(r'\("([^"]+\.onnx)",\s*"(https://[^"]+)"\)', src, re.S)
          assert pairs, "no model (name, url) pairs found in build.rs"
          out = pathlib.Path("crates/blazepose/models")
          out.mkdir(parents=True, exist_ok=True)
          for name, url in pairs:
              for wait in (0, 10, 30, 60):
                  time.sleep(wait)
                  try:
                      urllib.request.urlretrieve(url, out / name)
                      print(f"ok: {name} ({(out / name).stat().st_size} bytes)")
                      break
                  except Exception as e:  # noqa: BLE001 — retry everything
                      print(f"retry {name}: {e}")
              else:
                  raise SystemExit(f"failed to download {name}")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: onnx-models
          path: crates/blazepose/models/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.suffix }}
    needs: [check, fetch-models]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            plugin_lib: libheadtracking.so
            demo_bin: headtracking-demo
            archive: tar.gz

          # GitHub started offering free `ubuntu-24.04-arm` runners for
          # public repos late 2024 — native ARM Linux removes the whole
          # cross-compile / Docker container song-and-dance.
          - suffix: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            plugin_lib: libheadtracking.so
            demo_bin: headtracking-demo
            archive: tar.gz

          - suffix: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            plugin_lib: headtracking.dll
            demo_bin: headtracking-demo.exe
            archive: zip

          # Windows ARM64 — disabled until upstream blockers clear:
          # `tract-linalg`'s ARM64 SIMD kernels are GAS .S files that
          # cl.exe ARM (the Windows-ARM C compiler) refuses to assemble
          # (LNK1181 on `arm64simd_mmm_*.o`). The portable libusb
          # build path on our side works fine; the blocker is in the
          # ML inference dep chain. Re-enable once tract publishes a
          # Windows-ARM-compatible release. Audience is also nil today
          # — VPX itself ships no Windows ARM build.
          #
          # - suffix: windows-aarch64
          #   os: windows-11-arm
          #   target: aarch64-pc-windows-msvc
          #   plugin_lib: headtracking.dll
          #   demo_bin: headtracking-demo.exe
          #   archive: zip

          # macOS Intel — disabled: ort 2.0.0-rc.13 stopped shipping
          # prebuilt onnxruntime binaries for x86_64-apple-darwin, so the
          # demo build fails at ort-sys. Re-enable by either compiling
          # onnxruntime from source on that leg (slow) or when ort
          # restores the prebuilt. Intel Macs are also a shrinking VPX
          # audience; Apple Silicon below stays first-class.
          #
          # - suffix: macos-x86_64
          #   os: macos-26-intel
          #   target: x86_64-apple-darwin
          #   plugin_lib: libheadtracking.dylib
          #   demo_bin: headtracking-demo
          #   archive: tar.gz

          # macOS Apple Silicon: pinned to `macos-26` so we track the
          # same OS version on both arches. `macos-latest` floats and
          # would diverge over time.
          - suffix: macos-aarch64
            os: macos-26
            target: aarch64-apple-darwin
            plugin_lib: libheadtracking.dylib
            demo_bin: headtracking-demo
            archive: tar.gz

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Third-party actions are pinned to a commit SHA, not a tag: in March
      # 2026, 76 of `aquasecurity/trivy-action`'s 77 version tags were
      # force-pushed to malicious code. A tag is mutable, a SHA is not. The
      # trailing comment keeps the version readable when bumping.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Tag/Cargo.toml guard. A `vX.Y.Z` tag must match the crate version:
      # two neighbouring releases already shipped with a Cargo.toml one
      # version behind, green run and nobody to notice. Failing here — the
      # first job of the tag — means it happens before any signing and before
      # the release is published. The pre-release suffix is stripped:
      # `v1.2.3-rc1` matches Cargo.toml `1.2.3`.
      #
      # The root is a workspace, so the `headtracking` package is selected
      # explicitly (the one the build below produces with `-p headtracking`)
      # rather than whichever `cargo metadata` lists first. Every package
      # inherits that version, so this covers the demo too.
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"
          py=$(command -v python3 || command -v python)
          crate=$(cargo metadata --no-deps --format-version 1 \
            | "$py" -c 'import json,sys; pkgs=json.load(sys.stdin)["packages"]; print(next(p["version"] for p in pkgs if p["name"]=="headtracking"))')
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $tag) != version Cargo.toml ($crate) — aligne Cargo.toml ou retague."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME <-> Cargo.toml $crate : OK"

      # `prefix-key` bumped to v1: the v0 caches got poisoned — they held
      # ort-sys' build-script fingerprint (which replays a link-search
      # path into the ort download cache) WITHOUT the download cache
      # itself, so restored runs failed with "could not find native
      # static library onnxruntime" without even attempting a download.
      # `cache-directories` now persists that download dir alongside the
      # target dir so fingerprint and library can't drift apart again
      # (per-OS locations of ort-sys' `dirs` cache dir; missing paths
      # are skipped).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.target }}
          shared-key: release
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/ort.pyke.io

      # ---------- Platform-specific build deps ----------

      - name: Linux native deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          # libusb is now vendored statically by `libusb-sys` (no more
          # `libusb-1.0-0-dev`); the rest of this list is SDL3's
          # build-time deps (per https://wiki.libsdl.org/SDL3/README-linux)
          # for the standalone demo's static SDL3 build. The plugin
          # itself doesn't link SDL3 (resolved via dlsym at PluginLoad).
          sudo apt-get install -y --no-install-recommends \
            cmake clang libclang-dev pkg-config ninja-build \
            opencl-headers ocl-icd-opencl-dev \
            libudev-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            libsndio-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxss-dev \
            libxtst-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdbus-1-dev libibus-1.0-dev

      - name: macOS native deps
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          # libusb-sys now compiles libusb statically from the vendored
          # submodule on macOS too (using upstream's Xcode/config.h),
          # so the build no longer needs Homebrew's libusb. Only cmake
          # is needed for libfreenect[2], and the GitHub macOS runner
          # images already ship a current cmake — guard the install so
          # we don't print the "already installed and up-to-date"
          # warning every run.
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      # Now that `libusb-sys` vendors libusb statically and our
      # FindLibUSB shim short-circuits the bundled cmake module
      # (LibUSB_LIBRARIES is always pre-set from DEP_USB_1.0_LIB),
      # vcpkg's libusb + pkgconf are redundant — kept here for x64
      # only as a safety net while we validate the new path. ARM
      # Windows skips it: vcpkg's libusb x64 triplet wouldn't help,
      # and `arm64-windows` isn't required since libusb-sys's cc-rs
      # build handles the cross-arch compile cleanly.
      - name: Windows native deps (libusb via vcpkg + pkgconf)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          # Both libusb (the C lib) and pkgconf (so libfreenect2's
          # `pkg_check_modules(libusb-1.0)` succeeds) come from vcpkg —
          # avoids a separate Choco install and gives us a self-consistent
          # pkgconfig stack.
          # `opencl` gives the Khronos headers plus the ICD loader, which is
          # what `find_package(OpenCL)` needs for libfreenect2 to compile its
          # GPU depth pipeline. Without it the Kinect v2 falls back to the CPU
          # pipeline, drops USB depth packets and delivers ~5 fps instead of 30.
          #
          # Deliberately a different triplet from the rest: `-static-md` gives
          # a static loader against the DYNAMIC CRT, which is what mixes with a
          # normal MSVC Rust build (plain `-static` would switch the CRT too
          # and fight everything else here). Linking the loader in means no
          # `OpenCL.dll` to ship and no machine where a missing one stops the
          # plugin from loading at all. The loader is only a dispatcher — the
          # vendor driver still comes from the machine's GPU driver, and where
          # none is registered OpenCL reports zero platforms and the shim falls
          # back to the CPU pipeline exactly as before.
          vcpkg install libusb:x64-windows pkgconf:x64-windows
          vcpkg install opencl:x64-windows-static-md
          # vcpkg's bash on Windows ships native paths with backslashes;
          # cmake / pkg-config want forward slashes. Normalise once.
          vcpkg_root="${VCPKG_INSTALLATION_ROOT//\\//}"
          installed="${vcpkg_root}/installed/x64-windows"

          # Surface paths to subsequent steps:
          # * VCPKG_ROOT             → freenect2-sys / libusb-sys lookups
          # * bin/ on PATH           → libusb-1.0.dll + pkgconf.exe at runtime
          # * tools/pkgconf on PATH  → makes `pkg-config` resolve via pkgconf
          # * CMAKE_TOOLCHAIN_FILE   → cmake-rs picks vcpkg's package finders
          # * VCPKG_TARGET_TRIPLET   → tell cmake which vcpkg triplet to use
          # * PKG_CONFIG_PATH        → so pkgconf finds libusb-1.0.pc
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV
          echo "${installed}/bin" >> $GITHUB_PATH
          echo "${installed}/tools/pkgconf" >> $GITHUB_PATH
          echo "CMAKE_TOOLCHAIN_FILE=${vcpkg_root}/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=x64-windows" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${installed}/lib/pkgconfig" >> $GITHUB_ENV
          # OpenCL lives under its own triplet, so the vcpkg toolchain's
          # `find_package` (pinned to x64-windows) will not see it. Hand
          # freenect2-sys the exact paths instead of hoping a policy resolves.
          ocl="${vcpkg_root}/installed/x64-windows-static-md"
          echo "HT_OPENCL_INCLUDE_DIR=${ocl}/include" >> $GITHUB_ENV
          echo "HT_OPENCL_LIBRARY=${ocl}/lib/OpenCL.lib" >> $GITHUB_ENV

      # ---------- Build ----------

      # Pre-seed the ONNX models fetched once by `fetch-models` —
      # blazepose's build.rs sees them and skips its own download.
      - name: Restore shared ONNX models
        uses: actions/download-artifact@v8
        with:
          name: onnx-models
          path: crates/blazepose/models

      - name: Build plugin (cargo)
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p headtracking

      - name: Build demo (cargo)
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p headtracking-demo

      # ---------- Stage + archive ----------

      # The binaries produced here are NOT signed: Apple signing (like
      # Windows signing) happens further down, in dedicated jobs behind the
      # `signing` environment. Signing secrets are only readable by a job that
      # declares that environment, so this build job can no longer — and must
      # no longer — touch them.

      # On Windows we ship a `setup/` folder with a one-click setup
      # script (downloads UsbDk on demand, blocks PnP for Kinect
      # VID/PIDs, removes existing partial driver bindings). The
      # signed MSI itself is NOT bundled — Daynix's own GitHub release
      # is the authoritative source, and the script pulls it from
      # there at runtime. Other OSes don't need any of this.

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Tag push → the release version; main push / dispatch → a
          # `dev-<shortsha>` marker so testers can tell dev builds apart.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi
          stage="staging-${{ matrix.suffix }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.plugin_lib }}" "$stage/"
          cp "target/${{ matrix.target }}/release/${{ matrix.demo_bin }}" "$stage/"
          cp plugin.cfg "$stage/"
          [ -f LICENSE ] && cp LICENSE "$stage/" || true
          [ -f README.md ] && cp README.md "$stage/" || true
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            # Bundle the full setup/ tree (cmd launcher, PS1 logic,
            # 9 WinUSB INF/CAT pairs covering every Kinect hardware
            # revision) so the user can double-click `setup-kinect.cmd`
            # and have everything wired up in one shot.
            cp -r tools/windows-release/setup "$stage/"
          fi
          # macOS: ensure the executable + dylib have the +x bit set so
          # double-clicking the binary in Finder works after extraction.
          # `cargo build --release` already sets it, but `cp` preserves
          # that and `tar` keeps the mode — explicit chmod here is a
          # defensive belt for past CI hosts that stripped exec bits.
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            chmod +x "$stage/${{ matrix.demo_bin }}"
            chmod +x "$stage/${{ matrix.plugin_lib }}"
          fi
          echo "STAGE_DIR=$stage" >> "$GITHUB_ENV"
          echo "ARTIFACT_BASENAME=headtracking-${version}-${{ matrix.suffix }}" >> "$GITHUB_ENV"

      # Upload the staged DIRECTORY contents directly. `upload-artifact`
      # always wraps its input in a single `<artifact-name>.zip` at
      # download time. If we pre-zipped here, end-users would download
      # `<name>.zip` containing `<name>.zip` containing the actual
      # files — a double-wrap. Letting the action zip the directory
      # itself gives a single, clean wrap.
      #
      # Side-effect: the artifact downloaded from a `workflow_dispatch`
      # run is always a `.zip` (GitHub's wrapper format), regardless of
      # OS. Tagged releases re-archive in the publish job below into
      # the canonical per-OS format (`.tar.gz` for unix, `.zip` for
      # Windows) — those are the assets that show up on the GitHub
      # Release page.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_BASENAME }}
          path: ${{ env.STAGE_DIR }}/
          if-no-files-found: error
          retention-days: 7

  # Apple signing + notarisation. Behind `signing` for the same reason as
  # Windows: a Developer ID signature commits the owner's identity — and so
  # their reputation — and must never go out without explicit approval. The
  # APPLE_* secrets live in that environment, so only a job declaring it can
  # read them, which is why this is separate from the build.
  sign-apple:
    name: Sign macOS binaries
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    environment: signing
    steps:
      # Artifact names carry the tag version; the matrix does not exist here,
      # so the macOS suffix is resolved explicitly. (Just one: Apple Silicon.
      # If macOS Intel comes back to the matrix, add a second download/upload
      # BY NAME — never a `pattern:`. `download-artifact` only adds the
      # per-artifact subfolder when the pattern matches SEVERAL artifacts; a
      # single match extracts at the root of `path` and breaks every path
      # assumption below. That is exactly the bug that failed the first run.)
      - name: Resolve artifact names
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "ART_ARM=headtracking-${version}-macos-aarch64" >> "$GITHUB_ENV"

      - name: Download the macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ART_ARM }}
          path: dl/headtracking-macos-aarch64

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # Ephemeral keychain with a random password: created here, used by
          # codesign, destroyed with the runner. Nothing else ever sees it.
          KEYCHAIN_PWD=$(uuidgen)
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
              $(security list-keychains -d user | tr -d '"')
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          P12="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN_PATH" \
              -P "$APPLE_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" >/dev/null
          rm "$P12"

          # Resolve the identity (CN of the imported certificate) for the steps below.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep "Developer ID Application" | head -n1 \
              | sed -E 's/^.*"([^"]+)".*$/\1/')
          if [ -z "$IDENTITY" ]; then
              echo "::error::No Developer ID Application identity found after import"
              exit 1
          fi
          echo "Found signing identity: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Sign the dylib and the demo binary with the Developer ID Application
      # identity. The hardened runtime is mandatory for notarisation (Apple
      # rejects submissions without it). `--timestamp` pins a trusted
      # timestamp, so the signature stays valid past the certificate's
      # expiry.
      #
      # No entitlements file: the demo's camera and USB access go through
      # standard public APIs that need no provisioning profile, and TCC will
      # ask for camera permission once on first launch (and remember it).
      #
      # Notarisation: both binaries are ditto-zipped TOGETHER and submitted as
      # a single request per architecture. Stapling is deliberately skipped —
      # `xcrun stapler staple` only handles .app / .pkg / .dmg bundles, not
      # bare Mach-O files. Without stapling, Gatekeeper asks Apple online on
      # first launch (fine as long as the user has a network).
      - name: Sign & notarize the macOS binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # Submit and wait, with a timeout and up to 3 attempts (5/15/45 min).
          notarize_once() {
            local zip="$1" timeout="$2"
            local output
            output=$(xcrun notarytool submit "$zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --verbose 2>&1)
            echo "$output"
            local sub_id
            sub_id=$(echo "$output" | awk '/id:/{print $2; exit}')
            [ -n "$sub_id" ] || { echo "failed: no submission id"; return 1; }
            echo "submitted (id: $sub_id)"

            local deadline=$((SECONDS + timeout))
            while [ $SECONDS -lt $deadline ]; do
              sleep 30
              local info
              info=$(xcrun notarytool info "$sub_id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_ID_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" 2>&1) || { echo "network error, polling again"; continue; }
              local status
              status=$(echo "$info" | awk '/status:/{print $2; exit}')
              echo "status: $status"
              case "$status" in
                Accepted) return 0 ;;
                Invalid|Rejected)
                  xcrun notarytool log "$sub_id" \
                    --apple-id "$APPLE_ID" \
                    --password "$APPLE_ID_PASSWORD" \
                    --team-id "$APPLE_TEAM_ID" 2>&1 || true
                  return 1 ;;
              esac
            done
            echo "timed out after $((timeout / 60)) min"
            return 2
          }

          notarize() {
            local zip="$1"
            local backoffs=(300 900 2700)
            for i in 0 1 2; do
              echo "notarisation: attempt $((i + 1))/3"
              notarize_once "$zip" "${backoffs[$i]}" && return 0
              local rc=$?
              [ $rc -eq 2 ] || return $rc   # only a timeout is worth retrying
            done
            return 1
          }

          for art in "$ART_ARM"; do
            echo "::group::$art"
            work="dl/headtracking-macos-aarch64"

            # `upload-artifact` round-trips through a zip blob, which doesn't
            # preserve POSIX executable bits: files come back as 0644. Restore
            # them before signing, so what gets notarised is exactly what will
            # be launched.
            chmod +x "$work/libheadtracking.dylib" "$work/headtracking-demo"

            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$work/libheadtracking.dylib"
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$work/headtracking-demo"
            # Quick sanity check — `codesign --verify` exits non-zero if
            # the signature is malformed or the cert chain is broken.
            codesign --verify --deep --strict --verbose=2 "$work/libheadtracking.dylib"
            codesign --verify --deep --strict --verbose=2 "$work/headtracking-demo"

            # One submission per architecture: the zip holds both binaries
            # (plus the rest of the staged folder, which Apple ignores).
            NOTARIZE_ZIP="$RUNNER_TEMP/notarize-$art.zip"
            /usr/bin/ditto -c -k --keepParent "$work" "$NOTARIZE_ZIP"
            # Hard failure. The original soft-fail was justified by how
            # flaky Apple's notary service is, but there was no retry then: a
            # single phantom 401 was enough to publish un-notarised binaries
            # with nothing turning red. The 3 attempts with backoff
            # (5/15/45 min) cover that now, and a green CI has to mean
            # "notarised" — otherwise we only find out from a user stopped by
            # Gatekeeper.
            if ! notarize "$NOTARIZE_ZIP"; then
              echo "::error::$art: notarisation failed after 3 attempts — stopping the release rather than publishing binaries Gatekeeper will refuse."
              exit 1
            fi
            rm -f "$NOTARIZE_ZIP"
            echo "::endgroup::"
          done

      # Re-upload under the original name with the folder contents as-is
      # (same files, same layout) — only the two Mach-O files changed.
      - name: Re-upload the signed macOS arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ART_ARM }}
          path: dl/headtracking-macos-aarch64/
          if-no-files-found: error
          overwrite: true

  # Authenticode-sign the Windows plugin DLL + demo EXE with ssign — the Linux
  # runner signs them via Certum (no Windows, no vendor stack). Gated by the
  # `signing` environment (owner approval); the release below needs it, so a tag
  # is: build → approve → signed release.
  sign-windows:
    name: Sign Windows binaries
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - name: Install ssign (prebuilt binary from the latest release)
        run: |
          curl -fsSL https://github.com/Le-Syl21/ssign/releases/latest/download/ssign-linux-x86_64.tar.gz | tar xz
          sudo install -m755 ssign /usr/local/bin/ssign

      # ssign's own signer covers PE only; every other Authenticode format
      # (here: the PowerShell installer script) goes through its PKCS#11
      # module + osslsigncode, per ssign's README. Pinned to the v0.1.4 tag.
      - name: Build the ssign PKCS#11 module (script signing)
        run: |
          git clone --depth 1 --branch v0.1.4 https://github.com/Le-Syl21/ssign ssign-src
          cargo build --manifest-path ssign-src/Cargo.toml -p ssign-pkcs11 --release
          # osslsigncode's -ac wants PEM; ssign ships the Certum
          # intermediate as DER.
          openssl x509 -inform der -in ssign-src/ssign-core/src/certs/ccsca2021.der \
            -out ccsca2021.pem

      - name: Resolve artifact name
        run: echo "ART=headtracking-${GITHUB_REF_NAME#v}-windows-x86_64" >> "$GITHUB_ENV"

      - name: Download the Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ART }}
          path: win

      - name: Sign every signable file in the artifact (via Certum)
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          set -euo pipefail
          # Discover instead of hardcoding, so a new exe/dll/script added to
          # the ZIP can never ship unsigned by omission.
          #
          # DELIBERATE exclusion: setup/drivers/** — those .cat catalogs are
          # libwdi-signed and setup.ps1 pre-trusts THAT certificate before
          # pnputil. Re-signing them with the Certum Authenticode cert would
          # break driver binding (code-signing certs aren't valid for driver
          # packages; libwdi's self-sign + store-trust trick is the whole
          # point), so their signature must be left untouched.
          mapfile -t pe < <(find win -type f \
            \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.sys' \
               -o -iname '*.ocx' -o -iname '*.cpl' \) \
            -not -path 'win/setup/drivers/*' | sort)
          mapfile -t scripts < <(find win -type f \
            \( -iname '*.ps1' -o -iname '*.psm1' -o -iname '*.vbs' \
               -o -iname '*.js' \) \
            -not -path 'win/setup/drivers/*' | sort)
          echo "PE files to sign: ${pe[*]}"
          echo "Scripts to sign: ${scripts[*]:-none}"
          # Refuse to release a ZIP where discovery found nothing — that
          # means the layout changed under us, not that there is no work.
          [ "${#pe[@]}" -ge 2 ] || { echo "::error::expected at least the plugin DLL and demo EXE"; exit 1; }

          ssign --verbose \
            -n "headtracking" -u "https://github.com/${{ github.repository }}" \
            "${pe[@]}"
          # osslsigncode's -pkcs11module goes through OpenSSL's `pkcs11`
          # ENGINE, which is a separate package: without it the sign call dies
          # on `ENGINE_by_id: no such engine: id=pkcs11` after the PE files are
          # already signed. Engines are deprecated upstream in favour of
          # providers, so if this package ever disappears the fix is
          # osslsigncode's provider path, not a newer engine.
          sudo apt-get update -qq
          sudo apt-get install -y osslsigncode libengine-pkcs11-openssl
          # Check the facts, not the presence of a phrase. "Calculated message
          # digest" appears EVEN WHEN the digest does not match, and says
          # nothing about the timestamp: the old check therefore passed a
          # signature Windows would have rejected, and un-timestamped binaries
          # — invalid the moment the certificate expires.
          verify_signature() {
            local out
            out=$(osslsigncode verify "$1" 2>&1) || true
            echo "$out"
            if echo "$out" | grep -q "MISMATCH"; then
              echo "::error::$1: invalid Authenticode digest (Windows would see it as tampered with)"
              return 1
            fi
            if echo "$out" | grep -q "Timestamp is not available"; then
              echo "::error::$1: signature is not timestamped (invalid as soon as the certificate expires)"
              return 1
            fi
            if ! echo "$out" | grep -q "Signature verification: ok"; then
              echo "::error::$1: signature verification failed"
              return 1
            fi
          }
          for f in "${pe[@]}"; do
            verify_signature "$f"
          done

          # Scripts (0.0.31+: launchers enforce the signature with
          # -ExecutionPolicy RemoteSigned instead of bypassing policy).
          # Same cloud key, via the PKCS#11 module — osslsigncode knows
          # the PowerShell SIP format.
          # Check the engine up front rather than discovering it is missing
          # halfway through, so the error names the cause.
          if [ "${#scripts[@]}" -gt 0 ] && ! openssl engine pkcs11 >/dev/null 2>&1; then
            echo "::error::OpenSSL pkcs11 engine unavailable - scripts cannot be signed"
            exit 1
          fi
          for f in "${scripts[@]}"; do
            osslsigncode sign \
              -pkcs11module ssign-src/target/release/libssign_pkcs11.so \
              -pkcs11cert 'pkcs11:type=cert' -key 'pkcs11:type=private' \
              -ac ccsca2021.pem -h sha256 -t http://time.certum.pl/ \
              -in "$f" -out "$f.signed"
            mv "$f.signed" "$f"
            # Structural check: the SIP signature block must be appended.
            # (`osslsigncode verify` output for scripts is best-effort only.)
            grep -q "SIG # Begin signature block" "$f"
            osslsigncode verify "$f" || true
          done

      - name: Re-upload the signed Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ART }}
          path: win/
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: [build, sign-windows, sign-apple]
    runs-on: ubuntu-latest
    # Only publish on a real tag push AND only if every matrix target
    # built. `workflow_dispatch` runs are dry-runs (no tag, no
    # publish). Removing the `if: always()` ensures we never ship a
    # partial release — better no asset than a misleading one.
    if: success() && startsWith(github.ref, 'refs/tags/v')
    steps:
      # `download-artifact` extracts each artifact's contents under
      # `dist/<artifact-name>/`. We deliberately do NOT use
      # `merge-multiple` — we want one directory per OS so we can
      # re-archive each into its canonical format below.
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: List downloaded artifacts
        run: |
          ls -lah dist/
          for d in dist/*/; do
            echo "--- $d ---"
            ls -lah "$d"
          done

      # Re-archive each per-OS folder into the platform's canonical
      # archive type with files at the archive root (no wrapping
      # directory). Rationale: GUI extractors on Windows (right-click
      # → "Extract All...") and Linux (Files / Nautilus) already
      # create a folder named after the archive when extracting, so
      # an inner wrapping dir produces folder-in-folder
      # (`headtracking-X.Y.Z-windows-x86_64/headtracking-X.Y.Z-windows-x86_64/...`).
      # CLI users (`unzip`, `tar`) who want a clean folder can pass
      # `-d <name>` / extract into a fresh subdir themselves — that's
      # the price for matching what 95% of users actually do.
      - name: Repack artifacts for release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets release-staging
          for d in dist/*/; do
            name=$(basename "$d")
            # Internal fan-out artifact from the fetch-models job — not a
            # release deliverable (the models are embedded in the binaries).
            [ "$name" = "onnx-models" ] && continue
            mv "$d" "release-staging/$name"
            # `actions/upload-artifact` round-trips through a zip blob,
            # which doesn't preserve POSIX executable bits. Files come
            # back from `download-artifact` as 0644, so the demo binary
            # is non-executable when end-users extract the tarball
            # (macOS testers hit this hardest — Gatekeeper friction on
            # top of a missing `+x`). Restore the bit before re-archiving.
            # Windows is unaffected (`.exe` extension is what matters).
            case "$name" in
              *windows*) : ;;
              *)
                for bin in headtracking-demo libheadtracking.so libheadtracking.dylib; do
                  [ -e "release-staging/$name/$bin" ] && chmod +x "release-staging/$name/$bin" || true
                done
                ;;
            esac
            case "$name" in
              *windows*) ( cd "release-staging/$name" && zip -r "../../release-assets/${name}.zip" . ) ;;
              *)         tar -C "release-staging/$name" -czf "release-assets/${name}.tar.gz" . ;;
            esac
          done
          echo "--- release-assets ---"
          ls -lah release-assets/
          echo "--- archive top-level (sample) ---"
          # Sanity-print the first archive's entries — files should be
          # at the root, no inner `<name>/` directory.
          first=$(ls release-assets/ | head -n1)
          case "$first" in
            *.zip)    unzip -l "release-assets/$first" | head -10 ;;
            *.tar.gz) tar -tzf "release-assets/$first" | head -10 ;;
          esac

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
          generate_release_notes: true
          # Channel policy (decided 2026-08-07 after the "Latest badge on an
          # ancient build" incident): `-preview` is the PUBLIC download
          # channel — published as a normal release so GitHub's "Latest"
          # badge and the repo sidebar funnel everyone to it. -alpha /
          # -beta / -rc stay flagged pre-release (GitHub can't mark a
          # pre-release as Latest). PinReady is meant to offer the preview
          # channel at install time eventually.
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          make_latest: ${{ contains(github.ref, '-preview') && 'true' || 'legacy' }}
          fail_on_unmatched_files: false
