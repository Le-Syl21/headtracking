name: Release

# Triggered when a `vX.Y.Z` (or `vX.Y.Z-suffix`) tag is pushed. Each
# matrix target builds the cdylib (`headtracking`) + the standalone demo
# (`headtracking-demo`), bundles them with `plugin.cfg` and `LICENSE`,
# uploads as a GitHub Release artifact.
#
# Targets that don't build cleanly yet (e.g. cross-compiled aarch64
# Linux, Windows MSVC w/ vendored cmake projects) are marked
# `continue-on-error: true` so a partial matrix still produces a
# release with the working architectures. Fix per-target as they
# stabilise.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  # Manual dry-run: builds the whole matrix without publishing a release.
  # Use this to validate that every target builds before pushing the
  # actual tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # libfreenect2's submodule (v0.2.1) declares CMAKE_MINIMUM_REQUIRED < 3.5,
  # which CMake 4.x removed compatibility for. This env var tells CMake to
  # accept it. Applied at workflow level so every cmake-rs invocation in
  # the build picks it up.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # Pin the macOS deployment target so cc-rs / cmake / clang agree on a
  # single ABI level. Without this, cc-rs picks the runner's SDK version
  # (e.g. 15.5) for compiled .o files while rustc targets 11.0, and the
  # final link errors on `___isPlatformVersionAtLeast` (a clang
  # version-check helper that isn't needed when source SDK == target SDK).
  # 11.0 (Big Sur, late 2020) is broad enough for any pincab user.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            plugin_lib: libheadtracking.so
            demo_bin: headtracking-demo
            archive: tar.gz

          - suffix: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            plugin_lib: libheadtracking.so
            demo_bin: headtracking-demo
            archive: tar.gz
            cross: true
            experimental: true

          - suffix: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            plugin_lib: headtracking.dll
            demo_bin: headtracking-demo.exe
            archive: zip
            experimental: true

          # macOS x86_64 is cross-compiled from `macos-latest` (Apple
          # Silicon). The runner ships ARM Homebrew at /opt/homebrew; we
          # additionally bring up Rosetta 2 + an Intel Homebrew at
          # /usr/local in the prep step so brew can hand us an x86_64
          # libusb. See the `macOS native deps` step.
          - suffix: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            plugin_lib: libheadtracking.dylib
            demo_bin: headtracking-demo
            archive: tar.gz
            experimental: true

          - suffix: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            plugin_lib: libheadtracking.dylib
            demo_bin: headtracking-demo
            archive: tar.gz
            experimental: true

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          shared-key: release

      # ---------- Platform-specific build deps ----------

      - name: Linux native deps
        if: matrix.os == 'ubuntu-latest' && !matrix.cross
        run: |
          sudo apt-get update
          # Full SDL3 build-deps list (per
          # https://wiki.libsdl.org/SDL3/README-linux) plus libusb / libudev
          # for libfreenect[2]. Required by the demo's static SDL3 build;
          # the plugin itself doesn't link SDL3 (resolved via dlsym).
          sudo apt-get install -y --no-install-recommends \
            cmake clang libclang-dev pkg-config ninja-build \
            libusb-1.0-0-dev libudev-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            libsndio-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxss-dev \
            libxtst-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdbus-1-dev libibus-1.0-dev

      - name: Install cross (aarch64 Linux only)
        if: matrix.cross
        run: cargo install cross --locked --version ^0.2

      - name: macOS native deps
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          # ARM brew is preinstalled at /opt/homebrew on macos-latest
          # (Apple Silicon). Always install the ARM libusb / cmake; the
          # cmake binary is shared across both arches.
          /opt/homebrew/bin/brew install libusb cmake
          if [[ "${{ matrix.target }}" == "x86_64-apple-darwin" ]]; then
            # Cross-compile to Intel: bring up Rosetta and a separate
            # Intel Homebrew under /usr/local so we can link an x86_64
            # libusb. The runner image has Rosetta 2 available but not
            # always pre-installed; --agree-to-license + --install-rosetta
            # is idempotent and quick.
            sudo softwareupdate --install-rosetta --agree-to-license || true
            # Install Intel Homebrew. The official installer is arch-aware
            # — when run under Rosetta it lays itself out under /usr/local
            # automatically.
            arch -x86_64 /bin/bash -c \
              "NONINTERACTIVE=1 /bin/bash -c \"\$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\""
            arch -x86_64 /usr/local/bin/brew install libusb
            # `brew install` doesn't always create the /usr/local/lib
            # symlinks on a fresh Intel brew install (the post-install
            # link step can be skipped silently). Force it so the
            # linker can find `-lusb-1.0` via -L/usr/local/lib.
            arch -x86_64 /usr/local/bin/brew link --overwrite --force libusb
            # Sanity check: fail loudly here rather than during link
            # if the symlink wasn't created.
            ls -la /usr/local/lib/libusb-1.0.dylib
            # Point pkg-config / linker at the Intel install. PKG_CONFIG_PATH
            # ahead of the ARM one so freenect2-sys's pkg_config probe finds
            # the x86_64 .pc first.
            echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig" >> $GITHUB_ENV
            echo "LIBRARY_PATH=/usr/local/lib" >> $GITHUB_ENV
          fi

      - name: Windows native deps (libusb via vcpkg + pkgconf)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Both libusb (the C lib) and pkgconf (so libfreenect2's
          # `pkg_check_modules(libusb-1.0)` succeeds) come from vcpkg —
          # avoids a separate Choco install and gives us a self-consistent
          # pkgconfig stack.
          vcpkg install libusb:x64-windows pkgconf:x64-windows
          # vcpkg's bash on Windows ships native paths with backslashes;
          # cmake / pkg-config want forward slashes. Normalise once.
          vcpkg_root="${VCPKG_INSTALLATION_ROOT//\\//}"
          installed="${vcpkg_root}/installed/x64-windows"

          # Surface paths to subsequent steps:
          # * VCPKG_ROOT             → freenect2-sys / libusb-sys lookups
          # * bin/ on PATH           → libusb-1.0.dll + pkgconf.exe at runtime
          # * tools/pkgconf on PATH  → makes `pkg-config` resolve via pkgconf
          # * CMAKE_TOOLCHAIN_FILE   → cmake-rs picks vcpkg's package finders
          # * VCPKG_TARGET_TRIPLET   → tell cmake which vcpkg triplet to use
          # * PKG_CONFIG_PATH        → so pkgconf finds libusb-1.0.pc
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV
          echo "${installed}/bin" >> $GITHUB_PATH
          echo "${installed}/tools/pkgconf" >> $GITHUB_PATH
          echo "CMAKE_TOOLCHAIN_FILE=${vcpkg_root}/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=x64-windows" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${installed}/lib/pkgconfig" >> $GITHUB_ENV

      # ---------- Build ----------

      - name: Build plugin (cargo)
        if: '!matrix.cross'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p headtracking

      - name: Build demo (cargo)
        if: '!matrix.cross'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p headtracking-demo

      - name: Build (cross, aarch64 Linux)
        if: matrix.cross
        shell: bash
        run: |
          cross build --release --target ${{ matrix.target }} -p headtracking
          cross build --release --target ${{ matrix.target }} -p headtracking-demo

      # ---------- Stage + archive ----------

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="staging-${{ matrix.suffix }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.plugin_lib }}" "$stage/"
          cp "target/${{ matrix.target }}/release/${{ matrix.demo_bin }}" "$stage/"
          cp plugin.cfg "$stage/"
          [ -f LICENSE ] && cp LICENSE "$stage/" || true
          [ -f README.md ] && cp README.md "$stage/" || true
          echo "STAGE_DIR=$stage" >> "$GITHUB_ENV"
          echo "ARTIFACT_BASENAME=headtracking-${version}-${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - name: Tar (Linux / macOS)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tar -C "${STAGE_DIR}" -czf "${ARTIFACT_BASENAME}.tar.gz" .

      - name: Zip (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:STAGE_DIR\*" -DestinationPath "$env:ARTIFACT_BASENAME.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_BASENAME }}
          path: ${{ env.ARTIFACT_BASENAME }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only publish on a real tag push. `workflow_dispatch` runs are
    # dry-runs to validate the matrix; they upload artifacts but don't
    # create a GitHub release. `if: always()` lets the publish step run
    # even when some experimental targets failed (linux-aarch64 cross).
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lah dist/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
          # Tags with -alpha / -beta / -rc suffix are flagged as
          # pre-releases automatically.
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          fail_on_unmatched_files: false
