[workspace]
resolver = "3"
members = [
    "crates/face",
    "crates/freenect-sys",
    "crates/freenect",
    "crates/freenect2-sys",
    "crates/freenect2",
    "crates/libusb-sys",
    "crates/lockbar-onnx",
    "crates/u-onnx",
    "crates/webcam",
    "tools/headtracking-demo",
    "tools/lockbar-replay",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Le-Syl21/headtracking"

[package]
name = "headtracking"
version = "0.0.23"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Head tracking plugin for Visual Pinball X 10.8.1+"

[lib]
# `cdylib` so VPX's plugin loader can dlopen us; `rlib` so workspace
# binaries (`headtracking-demo`, `ht-calibrate`) can pull the shared algorithms
# (one-euro filter, lockbar detection, …) without duplication.
crate-type = ["cdylib", "rlib"]

[features]
# Default: all three hardware backends compiled in. The runtime `Backend`
# setting (Auto / Kinect v2 / Kinect v1 / Webcam) selects which one is used,
# with Auto walking a v2 → v1 → webcam fallback chain.
default = ["all-trackers"]
# Each backend pulls the face-detection crate alongside its capture library
# — every path uses YuNet bbox + face-anchored depth (Kinect) or IOD
# triangulation (webcam).
kinect-v1 = ["dep:freenect", "dep:face"]
kinect-v2 = ["dep:freenect2", "dep:face"]
webcam = ["dep:libloading", "dep:face"]
all-trackers = ["kinect-v1", "kinect-v2", "webcam"]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Read OS distro + version (e.g. "Ubuntu 24.04 LTS", "Windows 11") at
# PluginLoad — `std::env::consts::OS` only gives "linux"/"windows", which
# is not enough to triage user reports.
os_info = { version = "3", default-features = false }
arc-swap = "1"
parking_lot = "0.12"
nalgebra = "0.34"
thiserror = "2"
freenect = { path = "crates/freenect", optional = true }
freenect2 = { path = "crates/freenect2", optional = true }
face = { path = "crates/face", optional = true }
# libloading powers the runtime SDL3 lookup for the webcam backend: we
# resolve symbols against `libSDL3.so` already loaded by VPX, instead of
# linking SDL3 statically into the plugin and ending up with two SDL3
# state machines in the same process. Standalone tools (headtracking-demo) keep
# the static SDL3 path via the `webcam` workspace crate.
libloading = { version = "0.9", optional = true }

[build-dependencies]
bindgen = "0.72"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
