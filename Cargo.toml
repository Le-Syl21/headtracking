[workspace]
resolver = "3"
members = [
    "crates/freenect-sys",
    "crates/freenect",
    "crates/freenect2-sys",
    "crates/freenect2",
    "crates/webcam",
    "tools/ht-debug",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Le-Syl21/headtracking"

[package]
name = "headtracking"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Head tracking plugin for Visual Pinball X 10.8.1+"

[lib]
# `cdylib` so VPX's plugin loader can dlopen us; `rlib` so workspace
# binaries (`ht-debug`, `ht-calibrate`) can pull the shared algorithms
# (one-euro filter, lockbar detection, …) without duplication.
crate-type = ["cdylib", "rlib"]

[features]
default = []
kinect-v1 = ["dep:freenect"]
kinect-v2 = ["dep:freenect2"]
all-trackers = ["kinect-v1", "kinect-v2"]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1"
parking_lot = "0.12"
nalgebra = "0.33"
thiserror = "2"
freenect = { path = "crates/freenect", optional = true }
freenect2 = { path = "crates/freenect2", optional = true }

[build-dependencies]
bindgen = "0.71"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
