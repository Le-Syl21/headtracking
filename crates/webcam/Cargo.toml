[package]
name = "webcam"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0 OR MIT"
description = "Cross-platform webcam capture wrapper around nokhwa for the head-tracker"
publish = false

[dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["input-native", "output-threaded"] }
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
