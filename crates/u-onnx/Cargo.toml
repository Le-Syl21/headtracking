[package]
name = "u-onnx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Playfield-U detector — YOLOv11n-seg ONNX run through pure-Rust tract inference"
publish = false

[dependencies]
# Same pure-Rust ONNX paradigm as `lockbar-onnx`/`face`: tract, no
# native ONNX Runtime to ship. The model is YOLOv11n-seg at 640×640
# (single class `u`): output0 `[1,37,8400]` (4 box + 1 score + 32 mask
# coeffs) and output1 `[1,32,160,160]` (32 mask prototypes).
tract-onnx = { version = "0.22", default-features = false }
image = { version = "0.25", default-features = false }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
# The validation example loads the val frames (jpg/png/webp) and writes
# PNG overlays, so it needs the codecs the library itself doesn't.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
