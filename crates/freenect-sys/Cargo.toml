[package]
name = "freenect-sys"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0 OR GPL-2.0-only"
description = "Low-level bindings to libfreenect (Kinect v1) via bindgen, with vendored static build"
publish = false

[lib]

# Pulled to share libusb sourcing logic with freenect2-sys: libusb-sys
# emits `cargo:include=` / `cargo:lib=` metadata that surfaces here as
# `DEP_USB_1_0_*` env vars, sidestepping the per-crate platform dance.
[dependencies]
libusb-sys = { path = "../libusb-sys" }

[build-dependencies]
bindgen = "0.72"
cmake = "0.1"

# libusb-sys is a build-time *link* dependency: build.rs reads its
# `DEP_USB_1.0_*` metadata to source libusb, but nothing `use`s it in Rust —
# so cargo-machete can't see it. Silence the false positive.
[package.metadata.cargo-machete]
ignored = ["libusb-sys"]
