[package]
name = "lockbar-onnx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Lockbar detector — YOLOv11n-OBB ONNX run through pure-Rust tract inference"
publish = false

[dependencies]
# Same paradigm as the `face` crate: pure-Rust ONNX via tract. The
# lockbar model is YOLOv11n-OBB at 640×640 (~6 MB, single class
# 'lockbar'). On CPU tract serves ~50-80 ms per inference; on the
# tracker thread we cache the last detection between frames, so the
# overlay stays responsive.
tract-onnx = { version = "0.22", default-features = false }
image = { version = "0.25", default-features = false }
thiserror = "2"
tracing = "0.1"
