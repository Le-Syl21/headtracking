[package]
name = "ht-debug"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Standalone visualization of the Kinect head-tracker (RGB + tracked point + distance + logs)"
publish = false

[[bin]]
name = "ht-debug"
path = "src/main.rs"

[dependencies]
freenect = { path = "../../crates/freenect" }
freenect2 = { path = "../../crates/freenect2" }
webcam = { path = "../../crates/webcam" }
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
