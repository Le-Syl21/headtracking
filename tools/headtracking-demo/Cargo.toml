[package]
name = "headtracking-demo"
version = "0.0.11"
edition.workspace = true
license.workspace = true
description = "Standalone visualization of the Kinect / webcam head-tracker (RGB + face bbox + VPX delta + logs)"
publish = false

[[bin]]
name = "headtracking-demo"
path = "src/main.rs"

[dependencies]
face = { path = "../../crates/face" }
freenect = { path = "../../crates/freenect" }
freenect2 = { path = "../../crates/freenect2" }
webcam = { path = "../../crates/webcam" }
headtracking = { path = "../.." }
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
os_info = { version = "3", default-features = false }
