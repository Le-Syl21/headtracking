[package]
name = "headtracking-demo"
version = "0.0.23"
edition.workspace = true
license.workspace = true
description = "Standalone visualization of the Kinect / webcam head-tracker (RGB + face bbox + VPX delta + logs)"
publish = false

[[bin]]
name = "headtracking-demo"
path = "src/main.rs"

[dependencies]
head = { path = "../../crates/head" }
freenect = { path = "../../crates/freenect" }
freenect2 = { path = "../../crates/freenect2" }
u-onnx = { path = "../../crates/u-onnx" }
webcam = { path = "../../crates/webcam" }
headtracking = { path = "../.." }
# Linear algebra for the parallax off-axis projection (Matrix4: column-major
# storage → feeds glUniformMatrix4fv directly via as_slice).
nalgebra = "0.34"
# Manual egui integration (winit + glutin + glow + egui_glow) instead of
# eframe, so we can splice egui-rotate into the render loop: it rotates
# raw_input before egui sees it and the tessellated primitives before the
# paint — a seam eframe doesn't expose. Needed for the physically-rotated
# pincab display (270° default, ⟳ button cycles 90°).
egui = "0.35"
egui_glow = "0.35"
egui-winit = { version = "0.35", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
egui-rotate = { version = "0.1.6", features = ["software-cursor"] }
glow = "0.17"
glutin = "0.32"
glutin-winit = "0.5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
os_info = { version = "3", default-features = false }
# PNG encoder for the in-app screenshot button (saves the latest RGB
# frame next to the binary, named after the active device + timestamp).
# Already in the lockfile as a transitive dep — listing it here just
# makes the direct usage explicit, no extra build cost.
png = "0.18"
