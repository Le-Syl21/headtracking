[package]
name = "headtracking-demo"
version = "0.0.33"
edition.workspace = true
license.workspace = true
description = "Standalone visualization of the Kinect / webcam head-tracker (RGB + face bbox + VPX delta + logs)"
publish = false

[[bin]]
name = "headtracking-demo"
path = "src/main.rs"

[dependencies]
freenect = { path = "../../crates/freenect" }
freenect2 = { path = "../../crates/freenect2" }
blazepose = { path = "../../crates/blazepose" }
anchor = { path = "../../crates/anchor" }
webcam = { path = "../../crates/webcam" }
headtracking = { path = "../.." }
# Linear algebra for the parallax off-axis projection (Matrix4: column-major
# storage → feeds glUniformMatrix4fv directly via as_slice).
nalgebra = "0.35"
# Manual egui integration (winit + glutin + glow + egui_glow) instead of
# eframe, so we can splice egui-rotate into the render loop: it rotates
# raw_input before egui sees it and the tessellated primitives before the
# paint — a seam eframe doesn't expose. Needed for the physically-rotated
# pincab display (270° default, ⟳ button cycles 90°).
egui = "0.36"
egui_glow = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
egui-rotate = { version = "3.1", features = ["software-cursor", "inspection"] }
glutin = "0.32"
glutin-winit = "0.5"
parking_lot = "0.12"
# Lock-free single-slot publish of the latest captured frame from the capture
# thread to the GL thread. Tiny, pure-Rust — keeps the zero-install/static goal.
arc-swap = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
os_info = { version = "3", default-features = false }
# PNG encoder for the in-app screenshot button (saves the latest RGB
# frame next to the binary, named after the active device + timestamp).
# Already in the lockfile as a transitive dep — listing it here just
# makes the direct usage explicit, no extra build cost.
png = "0.18"
# Blocking HTTPS client (rustls TLS, no system OpenSSL) for the optional
# "Share a capture" contribution upload to a write-only Nextcloud drop. Only
# does a single PUT per file, off the UI thread.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# JPEG decode for the embedded setup / example thumbnails in the "Share a
# capture" help (jpeg only — already in the lockfile transitively).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Native folder picker for "keep my own copy of the capture". `xdg-portal`
# (not gtk3) keeps the zero-install promise on Linux: the dialog goes through
# the desktop portal over D-Bus, so no GTK to link or ship.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Per-process CPU and memory, on every platform. Replaces a hand-rolled
# /proc/self/stat reader that silently reported 0% everywhere but Linux —
# which hid the Kinect v2's CPU depth pipeline saturating on Windows.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[build-dependencies]
# Embeds assets/icon.ico as the .exe icon on Windows; inert elsewhere.
winresource = "0.1"
